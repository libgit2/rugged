name: Rugged CI

on:
  pull_request:
  push:
    branches:
    - master
    - maint/*

jobs:
  macOS:
    strategy:
      fail-fast: false
      matrix:
        ruby: [ '3.1', '3.2', '3.3', '3.4', '4.0' ]
        os: [ macOS-15 ]
    runs-on: ${{ matrix.os }}

    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    env:
      SKIP_SSH_TESTS: true
    steps:
    - uses: actions/checkout@master
    - name: update submodule
      run: git submodule update --init
    - name: Install macOS packages
      run: ./vendor/libgit2/ci/setup-osx-build.sh
    - name: Set up Ruby on macOS
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: run build
      run: |
        ruby --version
        ./script/travisbuild

  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        ruby: [ '3.1', '3.2', '3.3', '3.4', '4.0' ]
        os: [ ubuntu-22.04, ubuntu-24.04, ubuntu-26.04 ]
        exclude:
          - ruby: '3.1'
            os: ubuntu-26.04

    runs-on: ${{ matrix.os }}

    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    steps:
    - uses: actions/checkout@master
    - name: update submodule
      run: git submodule update --init
    - name: Install Linux packages
      run: |
        sudo apt update
        sudo apt install -y libssh2-1-dev libgpg-error-dev openssh-client openssh-server
        pkg-config --libs --static libcrypto | grep -q jitterentropy && sudo apt install -y libjitterentropy3-dev || true
    - name: Set up Ruby on Linux
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: run build
      run: |
        ruby --version
        ./script/travisbuild
